name: Notify Discord

on:
  workflow_run:
    workflows: ["Update Repositories"]
    types: [completed]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download package summary
        if: github.event_name != 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: package-summary
          path: /tmp
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          if [ -f /tmp/pkg-summary.txt ]; then
            MSG=$(cat /tmp/pkg-summary.txt)
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MSG=$(echo -e "📦 **Manual package sync triggered**\n<https://apt.inled.es>")
          else
            MSG=$(echo -e "📦 **Package(s) uploaded to apt.inled.es**\n<$RUN_URL>\n<https://apt.inled.es>")
          fi

          # Discord rejects messages over 2000 chars, so send the message
          # in chunks of complete lines below that limit.
          MAX_LEN=1900

          send_chunk() {
            jq -n --arg content "$1" '{"content": $content}' | \
              curl -sf -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d @- \
              || echo "::warning::Failed to send a Discord message chunk"
          }

          CHUNK=""
          while IFS= read -r line || [ -n "$line" ]; do
            # Flush current chunk if adding this line would exceed the limit
            if [ -n "$CHUNK" ] && [ $(( ${#CHUNK} + ${#line} + 1 )) -gt $MAX_LEN ]; then
              send_chunk "$CHUNK"
              CHUNK=""
            fi
            # Split lines that are individually longer than the limit
            while [ ${#line} -gt $MAX_LEN ]; do
              send_chunk "${line:0:$MAX_LEN}"
              line="${line:$MAX_LEN}"
            done
            if [ -z "$CHUNK" ]; then
              CHUNK="$line"
            else
              CHUNK="$CHUNK"$'\n'"$line"
            fi
          done <<< "$MSG"

          [ -n "$CHUNK" ] && send_chunk "$CHUNK"
