name: Notify Discord

on:
  workflow_run:
    workflows: ["Update Repositories"]
    types: [completed]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download package summary
        if: github.event_name != 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: package-summary
          path: /tmp
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          if [ -f /tmp/pkg-summary.txt ]; then
            MSG=$(cat /tmp/pkg-summary.txt)
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MSG=$(echo -e "📦 **Manual package sync triggered**\n<https://apt.inled.es>")
          else
            MSG=$(echo -e "📦 **Package(s) uploaded to apt.inled.es**\n<$RUN_URL>\n<https://apt.inled.es>")
          fi
          jq -n --arg msg "$MSG" '{"content": $msg}' | \
            curl -s -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d @-
