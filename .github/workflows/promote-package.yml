name: Promote Package (Unstable -> Stable)

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Nombre del paquete o 'all' / Package name to promote or 'all'"
        required: true
        default: "all"

permissions:
  contents: write
  deployments: write

concurrency:
  group: aptly-repo
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aptly gpg createrepo-c pacman-package-manager zstd libarchive-tools

      - name: Restore Aptly cache
        uses: actions/cache@v4
        with:
          path: |
            .aptly
            public/rpm/repodata
            public/arch
          key: ${{ runner.os }}-aptly-cache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-aptly-cache-

      - name: Sync metadata and release assets
        run: |
          mkdir -p incoming public/rpm/repodata public/arch
          gh release download packages --pattern "packages.json" --dir . --repo ${{ github.repository }} --clobber || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Import GPG Key
        id: gpg
        run: |
          if [ -z "${{ secrets.GPG_PRIVATE_KEY }}" ]; then
            echo "%no-protection" > gpg-key-gen
            echo "Key-Type: RSA" >> gpg-key-gen
            echo "Key-Length: 4096" >> gpg-key-gen
            echo "Name-Real: Inled Repo" >> gpg-key-gen
            echo "Name-Email: repo@inled.es" >> gpg-key-gen
            echo "Expire-Date: 0" >> gpg-key-gen
            echo "%commit" >> gpg-key-gen
            gpg --batch --generate-key gpg-key-gen
          else
            echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          fi
          FPR=$(gpg --list-secret-keys --with-colons | grep '^fpr:' | head -1 | cut -d: -f10)
          echo "fingerprint=$FPR" >> $GITHUB_OUTPUT

      - name: Run Package Promotion
        run: |
          python3 promote-package.py "${{ github.event.inputs.package_name }}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update repository metadata
        run: |
          export RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/packages"
          export GPG_FINGERPRINT="${{ steps.gpg.outputs.fingerprint }}"
          export DISTRIBUTION="stable"
          ./update-repo.sh

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy public --project-name inled-apt --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
