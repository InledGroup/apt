name: Update Repositories

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [package_upload]
  workflow_dispatch:
    inputs:
      package_url:
        description: "URL of the .deb or .rpm package to add"
        required: false
      rebuild:
        description: "Set to true to re-download and re-sign all packages"
        required: false
        default: "false"
      branch:
        description: "Target branch/distribution (stable, forky, rolling)"
        required: false
        default: "stable"

permissions:
  contents: write
  deployments: write

concurrency:
  group: aptly-repo
  cancel-in-progress: false

jobs:
  update-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aptly gpg createrepo-c pacman-package-manager zstd libarchive-tools

      - name: Restore Aptly database
        uses: actions/cache@v4
        with:
          path: |
            .aptly
            public/rpm
            public/arch
          key: ${{ runner.os }}-aptly-cache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-aptly-cache-

      - name: Sync and Reconstruct Repositories
        run: |
          mkdir -p incoming public/rpm public/arch
          if [ ! -d ".aptly/db" ]; then
            echo "Aptly database cache not found. Reconstructing database from GitHub Release..."
            gh release download packages --dir incoming --repo ${{ github.repository }} --clobber || echo "No release yet"
            mv incoming/packages.json . 2>/dev/null || true
            rm -f incoming/*.sig
          else
            echo "Aptly database cache is present. Downloading packages.json only..."
            gh release download packages --pattern "packages.json" --dir . --repo ${{ github.repository }} --clobber || echo "No previous packages.json"
          fi
          # Always sync arch and rpm packages into public/ for cache persistence
          gh release download packages --pattern "*.pkg.tar.zst" --pattern "*.pkg.tar.zst.sig" --dir public/arch --repo ${{ github.repository }} --clobber 2>/dev/null || echo "No arch packages in release yet"
          gh release download packages --pattern "*.rpm" --dir public/rpm --repo ${{ github.repository }} --clobber 2>/dev/null || echo "No rpm packages in release yet"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Rebuild all packages (on [REBUILD] commit)
        if: |
          contains(github.event.head_commit.message, '[REBUILD]') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.rebuild == 'true')
        run: |
          echo "REBUILD flag detected: re-downloading all packages for re-signing..."
          gh release download packages --dir incoming --repo ${{ github.repository }} --clobber || echo "No release yet"
          mv incoming/packages.json . 2>/dev/null || true
          # Remove old signatures so packages get re-signed with the current GPG key
          rm -f incoming/*.sig
          echo "All packages downloaded. Old signatures removed. Re-signing will happen in the next steps."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Import GPG Key
        id: gpg
        run: |
          if [ -z "${{ secrets.GPG_PRIVATE_KEY }}" ]; then
            echo "Generating temporary GPG key..."
            echo "%no-protection" > gpg-key-gen
            echo "Key-Type: RSA" >> gpg-key-gen
            echo "Key-Length: 4096" >> gpg-key-gen
            echo "Name-Real: Inled Repo" >> gpg-key-gen
            echo "Name-Email: repo@inled.es" >> gpg-key-gen
            echo "Expire-Date: 0" >> gpg-key-gen
            echo "%commit" >> gpg-key-gen
            gpg --batch --generate-key gpg-key-gen
          else
            echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          fi
          # Export the fingerprint for subsequent steps
          FPR=$(gpg --list-secret-keys --with-colons | grep '^fpr:' | head -1 | cut -d: -f10)
          echo "fingerprint=$FPR" >> $GITHUB_OUTPUT
          echo "Using GPG fingerprint: $FPR"

      - name: Download package
        id: download
        if: github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && github.event.inputs.package_url != '')
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          mkdir -p incoming
          # Snapshot of incoming/ before this run's downloads, so we can tell
          # apart genuinely new packages from leftovers of previous steps
          find incoming -maxdepth 1 -type f | sort > /tmp/incoming-before.txt

          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "Processing dispatch payload..."
            PAYLOAD_OBJ=$(echo "$CLIENT_PAYLOAD" | jq 'if type == "string" then fromjson else . end')
            URLS_LIST=$(echo "$PAYLOAD_OBJ" | jq -r '.package_urls // empty')
            if [ -n "$URLS_LIST" ] && [ "$URLS_LIST" != "null" ]; then
              echo "Detected consolidated URL list..."
              echo "$URLS_LIST" | tr -s '[[:space:]]' '\n' | while read -r URL; do
                if [ -n "$URL" ]; then
                  FILENAME=$(basename "$URL")
                  echo "Downloading $URL..."
                  wget -q "$URL" -O "incoming/$FILENAME"
                fi
              done
            fi
            echo "$PAYLOAD_OBJ" | jq -r 'to_entries[] | select(.key | endswith("_url")) | select(.key != "package_urls") | .value' | while read -r URL; do
              if [ -n "$URL" ] && [ "$URL" != "null" ]; then
                FILENAME=$(basename "$URL")
                echo "Downloading $URL..."
                wget -q "$URL" -O "incoming/$FILENAME"
              fi
            done
          else
            URL="${{ github.event.inputs.package_url }}"
            URL=$(echo "$URL" | xargs)
            FILENAME=$(basename "$URL")
            echo "Downloading $URL..."
            wget -q "$URL" -O "incoming/$FILENAME"
          fi

          # Only the files added by this trigger are "new" (Discord summary)
          find incoming -maxdepth 1 -type f | sort > /tmp/incoming-after.txt
          comm -13 /tmp/incoming-before.txt /tmp/incoming-after.txt > /tmp/new-packages.txt || true
          echo "New packages detected: $(wc -l < /tmp/new-packages.txt)"

      - name: Update repository
        run: |
          RELEASE_TAG="packages"
          export RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}"
          export GPG_FINGERPRINT="${{ steps.gpg.outputs.fingerprint }}"
          
          # Parse target branch/distribution from repository_dispatch or workflow_dispatch
          PAYLOAD_OBJ=$(echo '${{ toJson(github.event.client_payload) }}' | jq 'if type == "string" then fromjson else . end' 2>/dev/null || echo "{}")
          export DISTRIBUTION=$(echo "$PAYLOAD_OBJ" | jq -r '.branch // empty')
          if [ -z "$DISTRIBUTION" ] || [ "$DISTRIBUTION" == "null" ]; then
            export DISTRIBUTION="${{ github.event.inputs.branch || 'stable' }}"
          fi
          echo "Updating repository for distribution branch: $DISTRIBUTION"
          
          # Fetch list of active release assets to prevent 404 references in indices and packages.json
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' --repo ${{ github.repository }} > current_assets.txt || touch current_assets.txt
          
          ./update-repo.sh
        env:
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/download/packages

      - name: Remove old package versions
        run: |
          TAG="packages"
          RELEASE_EXISTS=$(gh release view "$TAG" --repo ${{ github.repository }} 2>/dev/null && echo "true" || echo "false")
          if [ "$RELEASE_EXISTS" = "false" ]; then
            echo "Release does not exist yet, skipping cleanup"
            exit 0
          fi
          belongs_to_dist() {
            local asset_name="$1"
            local dist="$2"
            if [ "$dist" = "forky" ]; then
              [[ "$asset_name" == *"deb14"* ]]
              return $?
            elif [ "$dist" = "rolling" ]; then
              [[ "$asset_name" == *"rolling"* ]]
              return $?
            else
              if [[ "$asset_name" == *"deb13"* ]]; then
                return 0
              elif [[ "$asset_name" == *"deb14"* ]] || [[ "$asset_name" == *"rolling"* ]]; then
                return 1
              else
                return 0
              fi
            fi
          }

          echo "Cleaning up old package versions for distribution: $DISTRIBUTION..."
          for file in incoming/*.deb incoming/*.rpm incoming/*.pkg.tar.*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              if [[ "$filename" == *.deb ]]; then
                package_base=$(echo "$filename" | sed 's/_[0-9][0-9.~+:-]*_.*//')
                allowed_pattern="\.deb$"
              elif [[ "$filename" == *.rpm ]]; then
                package_base=$(echo "$filename" | sed 's/-[0-9][0-9.~+:-]*.rpm$//')
                allowed_pattern="\.rpm$"
              elif [[ "$filename" == *.pkg.tar.* ]]; then
                package_base=$(echo "$filename" | sed 's/-[0-9][0-9.~+:-]*-.*//')
                allowed_pattern="\.pkg\.tar\."
              else
                continue
              fi
              echo "Processing new package: $filename (base: $package_base)"
              gh release view "$TAG" --json assets --jq '.assets[].name' --repo ${{ github.repository }} | while read asset; do
                if [[ "$asset" =~ $allowed_pattern ]]; then
                  if [[ "$asset" == "${package_base}"_* ]] || [[ "$asset" == "${package_base}"-* ]]; then
                    if [ "$asset" != "$filename" ] && belongs_to_dist "$asset" "$DISTRIBUTION"; then
                      echo "  Deleting old version: $asset"
                      gh release delete-asset "$TAG" "$asset" --repo ${{ github.repository }} --yes || true
                      sleep 1
                    fi
                  fi
                fi
              done
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: packages
          files: |
            incoming/*.deb
            incoming/*.rpm
            incoming/*.pkg.tar.*
            packages.json
          overwrite_files: true

      - name: Save package list for Discord notification
        run: |
          extract_meta() {
            local base name ver
            base=$(basename "$1")
            if [[ "$base" == *.deb ]]; then
              # name_version_arch.deb
              name=${base%%_*}
              ver=$(echo "$base" | cut -d_ -f2)
            elif [[ "$base" == *.rpm ]]; then
              # name-version-release.arch.rpm (name may contain '-')
              local nv=${base%.rpm}
              local nv2=${nv%-*}
              name=${nv2%-*}
              ver=${nv2##*-}
            else
              # name-version-pkgrel-arch.pkg.tar.* (name may contain '-')
              local core=${base%%.pkg.tar.*}
              local core2=${core%-*}
              local core3=${core2%-*}
              name=${core3%%-*}
              ver=${core3##*-}
            fi
            echo "- \`${name}\` \`${ver}\`"
          }

          if [ -s /tmp/new-packages.txt ]; then
            # List only the packages received in this trigger's request
            echo "📦 **New packages on apt.inled.es**" > /tmp/pkg-summary.txt
            echo "" >> /tmp/pkg-summary.txt
            while IFS= read -r f; do
              [ -f "$f" ] || continue
              case "$f" in
                *.sig) continue ;;
              esac
              extract_meta "$f" >> /tmp/pkg-summary.txt
            done < /tmp/new-packages.txt
          else
            # No new packages in this run (metadata update, rebuild, etc.)
            echo "🔄 **Repository metadata updated**" > /tmp/pkg-summary.txt
          fi
          echo "" >> /tmp/pkg-summary.txt
          echo "<https://apt.inled.es>" >> /tmp/pkg-summary.txt

      - name: Upload package summary
        uses: actions/upload-artifact@v4
        with:
          name: package-summary
          path: /tmp/pkg-summary.txt
          retention-days: 1

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy public --project-name inled-apt --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
