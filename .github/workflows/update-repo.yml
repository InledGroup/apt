name: Update Repositories

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [package_upload]
  workflow_dispatch:
    inputs:
      package_url:
        description: "URL of the .deb or .rpm package to add"
        required: false

permissions:
  contents: write
  deployments: write

concurrency:
  group: aptly-repo
  cancel-in-progress: false

jobs:
  update-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install aptly and gpg
        run: |
          sudo apt-get update
          sudo apt-get install -y aptly gpg createrepo-c pacman-package-manager zstd libarchive-tools

      - name: Restore Aptly database
        uses: actions/cache@v4
        with:
          path: |
            .aptly
            public/rpm
            public/arch
          key: ${{ runner.os }}-aptly-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-aptly-

      - name: Sync and Reconstruct Repositories
        run: |
          mkdir -p incoming public/rpm public/arch
          echo "Reconstruyendo repositorios desde GitHub Releases..."
          # Only download metadata if needed - don't download all old versions
          gh release download packages --pattern "packages.json" --dir . --repo ${{ github.repository }} --clobber || echo "No hay packages.json previo"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Import GPG Key
        run: |
          if [ -z "${{ secrets.GPG_PRIVATE_KEY }}" ]; then
            echo "Generando llave GPG temporal..."
            echo "%no-protection" > gpg-key-gen
            echo "Key-Type: RSA" >> gpg-key-gen
            echo "Key-Length: 4096" >> gpg-key-gen
            echo "Name-Real: Inled Repo" >> gpg-key-gen
            echo "Name-Email: repo@inled.es" >> gpg-key-gen
            echo "Expire-Date: 0" >> gpg-key-gen
            echo "%commit" >> gpg-key-gen
            gpg --batch --generate-key gpg-key-gen
          else
            echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          fi

      - name: Download package
        id: download
        if: github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && github.event.inputs.package_url != '')
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          mkdir -p incoming
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            # Procesar múltiples URLs si existen / Process multiple URLs if they exist
            echo "Procesando payload de dispatch..."

            # Asegurar que el payload sea un objeto JSON (si es string, parsearlo con fromjson)
            # Ensure payload is a JSON object (if it's a string, parse it with fromjson)
            PAYLOAD_OBJ=$(echo "$CLIENT_PAYLOAD" | jq 'if type == "string" then fromjson else . end')

            # 1. Procesar package_urls (múltiples URLs separadas por espacio/nueva línea) si existe
            URLS_LIST=$(echo "$PAYLOAD_OBJ" | jq -r '.package_urls // empty')
            if [ -n "$URLS_LIST" ] && [ "$URLS_LIST" != "null" ]; then
              echo "Detectada lista consolidada de URLs..."
              echo "$URLS_LIST" | tr -s '[[:space:]]' '\n' | while read -r URL; do
                if [ -n "$URL" ]; then
                  FILENAME=$(basename "$URL")
                  echo "Descargando $URL..."
                  wget -q "$URL" -O "incoming/$FILENAME"
                fi
              done
            fi

            # 2. Procesar propiedades individuales que terminen en _url (compatibilidad hacia atrás)
            echo "$PAYLOAD_OBJ" | jq -r 'to_entries[] | select(.key | endswith("_url")) | select(.key != "package_urls") | .value' | while read -r URL; do
              if [ -n "$URL" ] && [ "$URL" != "null" ]; then
                FILENAME=$(basename "$URL")
                echo "Descargando $URL..."
                wget -q "$URL" -O "incoming/$FILENAME"
              fi
            done
          else
            URL="${{ github.event.inputs.package_url }}"
            URL=$(echo "$URL" | xargs)
            FILENAME=$(basename "$URL")
            echo "Descargando $URL..."
            wget -q "$URL" -O "incoming/$FILENAME"
          fi

      - name: Update repository
        # English: Run the repository update script (updates aptly, rpm, arch and web indexes)
        # Español: Ejecutar el script de actualización del repositorio (actualiza aptly, rpm, arch e índices web)
        run: |
          RELEASE_TAG="packages"
          export RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}"
          ./update-repo.sh
        env:
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/download/packages

      - name: Remove old package versions
        # English: Delete old versions of packages before uploading new ones to avoid accumulation
        # Español: Eliminar versiones antiguas de paquetes antes de subir los nuevos para evitar acumulación
        run: |
          TAG="packages"
          RELEASE_EXISTS=$(gh release view "$TAG" --repo ${{ github.repository }} 2>/dev/null && echo "true" || echo "false")

          if [ "$RELEASE_EXISTS" = "false" ]; then
            echo "Release does not exist yet, skipping cleanup"
            exit 0
          fi

          echo "Cleaning up old package versions..."

          # Process each new package
          for file in incoming/*.deb incoming/*.rpm incoming/*.pkg.tar.*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")

              # Extract base package name (remove version and architecture)
              # Examples: pulsaros-theme_1.0.1_all.deb -> pulsaros-theme
              #           pulsaros-1.0.1-1-x86_64.pkg.tar.zst -> pulsaros
              if [[ "$filename" == *.deb ]]; then
                package_base=$(echo "$filename" | sed 's/_[0-9][0-9.~+:-]*_.*//')
              elif [[ "$filename" == *.rpm ]]; then
                package_base=$(echo "$filename" | sed 's/-[0-9][0-9.~+:-]*.rpm$//')
              elif [[ "$filename" == *.pkg.tar.* ]]; then
                package_base=$(echo "$filename" | sed 's/-[0-9][0-9.~+:-]*-.*//')
              else
                continue
              fi

              echo "Processing new package: $filename (base: $package_base)"

              # Get list of all assets with same base name and delete them
              gh release view "$TAG" --json assets --jq '.assets[].name' --repo ${{ github.repository }} | while read asset; do
                # Check if this is an old version of the package we're uploading
                if [[ "$asset" == "${package_base}"_* ]] || [[ "$asset" == "${package_base}"-* ]]; then
                  if [ "$asset" != "$filename" ]; then
                    echo "  Deleting old version: $asset"
                    gh release delete-asset "$TAG" "$asset" --repo ${{ github.repository }} --yes || true
                    sleep 1
                  fi
                fi
              done
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true

      - name: Upload to GitHub Release
        # English: Upload packages and metadata to GitHub Release. Runs only if repository update succeeds.
        # Español: Subir paquetes y metadatos a GitHub Release. Se ejecuta sólo si la actualización del repositorio es exitosa.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: packages
          files: |
            incoming/*.deb
            incoming/*.rpm
            incoming/*.pkg.tar.*
            packages.json
          overwrite: true

      - name: Deploy to Cloudflare Pages
        # English: Deploy web UI and redirects to Cloudflare Pages
        # Español: Desplegar la interfaz web y las redirecciones a Cloudflare Pages
        run: npx wrangler pages deploy public --project-name inled-apt --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
