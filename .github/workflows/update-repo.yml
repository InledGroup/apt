name: Update Repositories

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [package_upload]
  workflow_dispatch:
    inputs:
      package_url:
        description: "URL of the .deb, .rpm or .pkg.tar.zst package to add"
        required: false
      rebuild:
        description: "Set to true to re-download and re-sign all packages"
        required: false
        default: "false"
      branch:
        description: "Target branch/distribution (stable, forky, rolling)"
        required: false
        default: "stable"

permissions:
  contents: write
  deployments: write

concurrency:
  group: aptly-repo
  cancel-in-progress: false

jobs:
  update-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aptly gpg createrepo-c pacman-package-manager zstd libarchive-tools

      - name: Restore Aptly and Metadata cache
        uses: actions/cache@v4
        with:
          path: |
            .aptly
            public/rpm/repodata
            public/arch
          key: ${{ runner.os }}-aptly-cache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-aptly-cache-

      - name: Sync metadata
        run: |
          mkdir -p incoming public/rpm/repodata public/arch
          if [ ! -d ".aptly/db" ]; then
            echo "Aptly database cache not found. Downloading packages.json..."
            gh release download packages --pattern "packages.json" --dir . --repo ${{ github.repository }} --clobber || echo "No previous packages.json"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Import GPG Key
        id: gpg
        run: |
          if [ -z "${{ secrets.GPG_PRIVATE_KEY }}" ]; then
            echo "Generating temporary GPG key..."
            echo "%no-protection" > gpg-key-gen
            echo "Key-Type: RSA" >> gpg-key-gen
            echo "Key-Length: 4096" >> gpg-key-gen
            echo "Name-Real: Inled Repo" >> gpg-key-gen
            echo "Name-Email: repo@inled.es" >> gpg-key-gen
            echo "Expire-Date: 0" >> gpg-key-gen
            echo "%commit" >> gpg-key-gen
            gpg --batch --generate-key gpg-key-gen
          else
            echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          fi
          # Export fingerprint
          FPR=$(gpg --list-secret-keys --with-colons | grep '^fpr:' | head -1 | cut -d: -f10)
          echo "fingerprint=$FPR" >> $GITHUB_OUTPUT
          echo "Using GPG fingerprint: $FPR"

      - name: Download package
        id: download
        if: github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && github.event.inputs.package_url != '')
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          mkdir -p incoming
          find incoming -maxdepth 1 -type f | sort > /tmp/incoming-before.txt

          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "Processing dispatch payload..."
            PAYLOAD_OBJ=$(echo "$CLIENT_PAYLOAD" | jq 'if type == "string" then fromjson else . end')
            URLS_LIST=$(echo "$PAYLOAD_OBJ" | jq -r '.package_urls // empty')
            if [ -n "$URLS_LIST" ] && [ "$URLS_LIST" != "null" ]; then
              echo "Detected consolidated URL list..."
              echo "$URLS_LIST" | tr -s '[[:space:]]' '\n' | while read -r URL; do
                if [ -n "$URL" ]; then
                  FILENAME=$(basename "$URL")
                  echo "Downloading $URL..."
                  wget -q "$URL" -O "incoming/$FILENAME"
                fi
              done
            fi
            echo "$PAYLOAD_OBJ" | jq -r 'to_entries[] | select(.key | endswith("_url")) | select(.key != "package_urls") | .value' | while read -r URL; do
              if [ -n "$URL" ] && [ "$URL" != "null" ]; then
                FILENAME=$(basename "$URL")
                echo "Downloading $URL..."
                wget -q "$URL" -O "incoming/$FILENAME"
              fi
            done
          else
            URL="${{ github.event.inputs.package_url }}"
            URL=$(echo "$URL" | xargs)
            FILENAME=$(basename "$URL")
            echo "Downloading $URL..."
            wget -q "$URL" -O "incoming/$FILENAME"
          fi

          find incoming -maxdepth 1 -type f | sort > /tmp/incoming-after.txt
          comm -13 /tmp/incoming-before.txt /tmp/incoming-after.txt > /tmp/new-packages.txt || true
          echo "New packages detected: $(wc -l < /tmp/new-packages.txt)"

      - name: Prune and Sync Release Assets
        run: |
          python3 prune-release.py --repo "${{ github.repository }}" --tag packages --incoming incoming
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update repository
        run: |
          RELEASE_TAG="packages"
          export RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}"
          export GPG_FINGERPRINT="${{ steps.gpg.outputs.fingerprint }}"
          
          PAYLOAD_OBJ=$(echo '${{ toJson(github.event.client_payload) }}' | jq 'if type == "string" then fromjson else . end' 2>/dev/null || echo "{}")
          export DISTRIBUTION=$(echo "$PAYLOAD_OBJ" | jq -r '.branch // empty')
          if [ -z "$DISTRIBUTION" ] || [ "$DISTRIBUTION" == "null" ]; then
            export DISTRIBUTION="${{ github.event.inputs.branch || 'stable' }}"
          fi
          echo "Updating repository for distribution branch: $DISTRIBUTION"
          
          ./update-repo.sh
        env:
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/download/packages

      - name: Upload new packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: packages
          files: |
            incoming/*.deb
            incoming/*.rpm
            incoming/*.pkg.tar.*
            incoming/*.sig
            packages.json
          overwrite_files: true

      - name: Save package list for Discord notification
        run: |
          extract_meta() {
            local base name ver
            base=$(basename "$1")
            if [[ "$base" == *.deb ]]; then
              name=${base%%_*}
              ver=$(echo "$base" | cut -d_ -f2)
            elif [[ "$base" == *.rpm ]]; then
              local nv=${base%.rpm}
              local nv2=${nv%-*}
              name=${nv2%-*}
              ver=${nv2##*-}
            else
              local core=${base%%.pkg.tar.*}
              local core2=${core%-*}
              local core3=${core2%-*}
              name=${core3%%-*}
              ver=${core3##*-}
            fi
            echo "- \`${name}\` \`${ver}\`"
          }

          if [ -s /tmp/new-packages.txt ]; then
            echo "📦 **New packages on apt.inled.es**" > /tmp/pkg-summary.txt
            echo "" >> /tmp/pkg-summary.txt
            while IFS= read -r f; do
              [ -f "$f" ] || continue
              case "$f" in
                *.sig) continue ;;
              esac
              extract_meta "$f" >> /tmp/pkg-summary.txt
            done < /tmp/new-packages.txt
          else
            echo "🔄 **Repository metadata updated**" > /tmp/pkg-summary.txt
          fi
          echo "" >> /tmp/pkg-summary.txt
          echo "<https://apt.inled.es>" >> /tmp/pkg-summary.txt

      - name: Upload package summary
        uses: actions/upload-artifact@v4
        with:
          name: package-summary
          path: /tmp/pkg-summary.txt
          retention-days: 1

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy public --project-name inled-apt --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
